AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - 'AWS::LanguageExtensions'
  - 'AWS::Serverless-2016-10-31'

Parameters:
  MyIp:
    Description: Client IP address in CIDR notation
    Type: String
    Default: "127.0.0.1/32"
  KeyPair:
    Description: EC2 Key Pair
    Type: "AWS::EC2::KeyPair::KeyName"
  Route53HostedZoneName:
    Description: "Optional Route53 hosted zone name (e.g.: play.example.com). Leave empty to skip creation."
    Type: String
    Default: ""
  NotificationEmail:
    Description: "Optional email address for spot interruption notifications. Leave empty to skip."
    Type: String
    Default: ""
Conditions:
  ManageRoute53HostedZone:
    Fn::Not:
      - Fn::Equals:
          - !Ref Route53HostedZoneName
          - ""
  HasNotificationEmail:
    Fn::Not:
      - Fn::Equals:
          - !Ref NotificationEmail
          - ""

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-instance-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedEC2InstanceDefaultPolicy
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-library-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "s3:ListBucket"
                Resource: !GetAtt LibraryBucket.Arn
              - Effect: Allow
                Action: "s3:*Object"
                Resource: !Join ["/", [!GetAtt LibraryBucket.Arn, "*"]]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-instance-profile"
      Path: "/"
      Roles:
        - !Ref InstanceRole
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}"
  Subnet1:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-${AWS::Region}a"
  Subnet2:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-${AWS::Region}b"
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"
  VpcInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref PublicRouteTable
  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref PublicRouteTable
  AdminAccess:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-admin"
      GroupDescription: Allow remote admin access
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIp
  GamingAccess:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-player"
      GroupDescription: Allow remote gaming access
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 47984
          ToPort: 47989
          CidrIp: !Ref MyIp
        - IpProtocol: tcp
          FromPort: 48010
          ToPort: 48031
          CidrIp: !Ref MyIp
        - IpProtocol: udp
          FromPort: 47998
          ToPort: 48015
          CidrIp: !Ref MyIp
  RemotePlayAccess:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-remote-play"
      GroupDescription: Allow Steam Remote Play
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 27031
          ToPort: 27036
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 27036
          ToPort: 27037
          CidrIp: 0.0.0.0/0
  LibraryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-library-${AWS::AccountId}"
  ControllerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${AWS::StackName}-controller"
      Path: /
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-start-stop-instances"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                Resource: "arn:aws:ec2:*:*:instance/*"
              - Effect: Allow
                Action:
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:DeleteVolume
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - "arn:aws:ec2:*:*:volume/*"

  SpotNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasNotificationEmail
    Properties:
      TopicName: !Sub "${AWS::StackName}-spot-interruption"
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail

  SpotNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasNotificationEmail
    Properties:
      Topics:
        - !Ref SpotNotificationTopic
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SpotNotificationTopic

  SpotInterruptionRule:
    Type: AWS::Events::Rule
    Condition: HasNotificationEmail
    Properties:
      Description: !Sub "Notify ${NotificationEmail} when a spot instance in ${AWS::StackName} is interrupted"
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Spot Instance Interruption Warning
      State: ENABLED
      Targets:
        - Id: SpotNotificationTarget
          Arn: !Ref SpotNotificationTopic
          InputTransformer:
            InputPathsMap:
              instance: "$.detail.instance-id"
              action: "$.detail.instance-action"
              time: "$.time"
            InputTemplate: |
              "Spot instance interruption warning at <time>
              Instance: <instance>
              Action: <action>
              You have ~2 minutes before the instance is terminated."

  Noble:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./launch-templates-noble.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        KeyPair: !Ref KeyPair

  NobleAmd:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./launch-templates-noble-amd.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        KeyPair: !Ref KeyPair

  HostedZoneWithAutoUpdate:
    Type: AWS::Serverless::Application
    Condition: ManageRoute53HostedZone
    Properties:
      Location: ./hosted-zone-with-auto-update.yaml
      Parameters:
        ParentStackName: !Ref AWS::StackName
        HostedZoneName: !Ref Route53HostedZoneName

Outputs:
  OnDemandLaunchTemplateNoble:
    Description: On-demand instance launch template (Noble)
    Value: !GetAtt Noble.Outputs.OnDemandLaunchTemplate
  SpotLaunchTemplateNoble:
    Description: Spot instance launch template (Noble)
    Value: !GetAtt Noble.Outputs.SpotLaunchTemplate
  OnDemandLaunchTemplateNobleAmd:
    Description: On-demand instance launch template (Noble, AMD)
    Value: !GetAtt NobleAmd.Outputs.OnDemandLaunchTemplate
  SpotLaunchTemplateNobleAmd:
    Description: Spot instance launch template (Noble, AMD)
    Value: !GetAtt NobleAmd.Outputs.SpotLaunchTemplate
  SubnetIds:
    Description: Comma-separated public subnet IDs for launching instances
    Value: !Join [",", [!Ref Subnet1, !Ref Subnet2]]
  SecurityGroupIds:
    Description: Comma-separated security group IDs for gaming instances
    Value: !Join [",", [!Ref AdminAccess, !Ref GamingAccess, !Ref RemotePlayAccess]]
  InstanceProfileName:
    Description: IAM instance profile name
    Value: !Ref InstanceProfile

# vim: ft=yaml.cloudformation
