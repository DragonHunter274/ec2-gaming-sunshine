UserData:
  Fn::Base64: |
    #cloud-config
    bootcmd:
      - dpkg --add-architecture i386
      - wget http://repo.steampowered.com/steam/archive/stable/steam.gpg -P /usr/share/keyrings/
    apt:
      preserve_sources_list: false
      sources:
        steam-stable.list:
          source: |
            deb [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam
            deb-src [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam
      conf: |
        APT {
          Install-Suggests "0";
          Install-Recommends "0";
        }
    package_update: true
    packages:
    - adwaita-icon-theme
    - alsa-utils
    - baobab
    - build-essential
    - dmz-cursor-theme
    - gdm3
    - gedit
    - gnome-control-center
    - gnome-session
    - gnome-shell-extension-appindicator
    - gnome-terminal
    - httpie
    - libc6-dev
    - libcanberra-pulse
    - libglvnd-dev
    - libva-drm2
    - libva2
    - libvdpau1
    - libvulkan1
    - linux-aws
    - linux-firmware
    - linux-modules-extra-aws
    - mesa-va-drivers
    - nautilus
    - pkg-config
    - pulseaudio
    - pulseaudio-module-gsettings
    - restic
    - steam-launcher
    - steam-libs-amd64
    - unzip
    - vainfo
    - xdg-desktop-portal-gtk
    - xdg-utils
    - xserver-xorg-core
    - xserver-xorg-dev
    - xserver-xorg-input-libinput
    - xserver-xorg-video-amdgpu
    users:
    - default
    - name: sunshine
      gecos: Sunshine
      groups: users, audio, video, plugdev, netdev, input, sudo
      shell: /bin/bash
    write_files:
    - path: /etc/sudoers.d/sunshine
      content: |
        sunshine ALL=(ALL) NOPASSWD:ALL
      permissions: '0440'
    - path: /etc/modules-load.d/amdgpu.conf
      content: |
        amdgpu
    - path: /etc/gdm3/custom.conf
      content: |
        [daemon]
        WaylandEnable=false
        AutomaticLoginEnable = true
        AutomaticLogin = sunshine
        [security]
        [xdmcp]
        [chooser]
        [debug]
    - path: /etc/udev/rules.d/85-sunshine-input.rules
      content: |
        KERNEL=="uinput", GROUP="input", MODE="0660", OPTIONS+="static_node=uinput"
    - path: /opt/sunshine_systemd_user_service.patch
      content: |
        5,7c5
        < PartOf=graphical-session.target
        < Wants=xdg-desktop-autostart.target
        < After=xdg-desktop-autostart.target
        ---
        > After=default.target
        15c13
        < WantedBy=xdg-desktop-autostart.target
        ---
        > WantedBy=default.target
    - path: /etc/systemd/user/sunshine.service.d/cloud-gaming.conf
      content: |
        [Unit]
        StartLimitIntervalSec=300
        StartLimitBurst=20
        [Service]
        Environment=DISPLAY=:0
        ExecStartPre=/bin/bash -c 'until DISPLAY=:0 xrandr &>/dev/null; do sleep 2; done'
        Restart=on-failure
        RestartSec=10
      permissions: '0644'
    - path: /usr/local/bin/spot-termination-monitor
      content: |
        #!/bin/bash
        TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" || true)
        while sleep 5; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-aws-ec2-metadata-token: $TOKEN" \
            "http://169.254.169.254/latest/meta-data/spot/termination-time" \
            --connect-timeout 2 --max-time 3)
          if [ "$HTTP_CODE" = "200" ]; then
            SUNSHINE_UID=$(id -u sunshine)
            sudo -u sunshine \
              DISPLAY=:0 \
              DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${SUNSHINE_UID}/bus" \
              notify-send -u critical -t 0 \
              "Spot instance terminating" \
              "AWS is reclaiming this instance in ~2 minutes. Starting backup now..."
            su -l sunshine -c backup || true
            break
          fi
        done
      permissions: '0755'
    - path: /etc/systemd/system/spot-termination-monitor.service
      content: |
        [Unit]
        Description=Monitor EC2 spot instance termination
        After=network-online.target
        Wants=network-online.target
        [Service]
        Type=simple
        ExecStart=/usr/local/bin/spot-termination-monitor
        Restart=on-failure
        RestartSec=30
        [Install]
        WantedBy=multi-user.target
    - path: /opt/init_mnt.sh
      content: |
        #!/bin/bash
        set -euo pipefail
        INST_DEV=""
        for dev in /dev/nvme[0-9]*n[0-9]*; do
          [ -e "$dev" ] || continue
          model=$(cat "/sys/block/$(basename $dev)/device/model" 2>/dev/null || echo "")
          echo "$model" | grep -qi "Instance Storage" && { INST_DEV=$dev; break; }
        done
        if [ -z "$INST_DEV" ]; then
          echo "No instance storage found, skipping" >&2
          exit 0
        fi
        mkfs.ext4 -F "$INST_DEV"
        mkdir -p /mnt/sunshine
        mount -o defaults,nofail "$INST_DEV" /mnt/sunshine
        chown sunshine:sunshine /mnt/sunshine
        echo "Mounted instance storage $INST_DEV at /mnt/sunshine"
      permissions: '0755'
    - path: /etc/systemd/system/init_mnt.service
      content: |
        [Unit]
        Description=Initialize game data mount
        After=network-online.target
        Wants=network-online.target
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/opt/init_mnt.sh
        Restart=on-failure
        RestartSec=10
        [Install]
        WantedBy=multi-user.target
    - path: /opt/install_amd_driver.sh
      content: |
        #!/bin/bash
        set -euo pipefail
        GPU_PCI=$(lspci -D | grep -i "1002:" | grep -iv audio | awk '{print $1}' | head -1)
        if [ -n "$GPU_PCI" ]; then
          echo "options amdgpu virtual_display=${GPU_PCI},1" > /etc/modprobe.d/amdgpu.conf
        fi
        cat > /etc/X11/xorg.conf << 'XORG'
        Section "ServerFlags"
            Option "AllowEmptyInitialConfiguration" "true"
        EndSection
        Section "Device"
            Identifier "Device0"
            Driver "amdgpu"
        EndSection
        Section "Screen"
            Identifier "Screen0"
            Device "Device0"
            DefaultDepth 24
            SubSection "Display"
                Depth 24
                Virtual 1920 1080
            EndSubSection
        EndSection
        XORG
        vainfo 2>&1 | head || true
      permissions: '0755'
    - path: /home/ubuntu/.bash_history
      content: |
        sudo loginctl unlock-sessions
        sudo reboot
        sudo /opt/install_amd_driver.sh
        tail  -f /var/log/cloud-init.log
      owner: ubuntu:ubuntu
      permissions: '0600'
      defer: true
    - path: /usr/lib/systemd/user/init_desktop_settings.service
      content: |
        [Unit]
        Description=Init desktop settings
        [Service]
        Type = oneshot
        RemainAfterExit = yes
        ExecStart=/usr/bin/gnome-extensions enable ubuntu-appindicators@ubuntu.com
        ExecStart=/usr/bin/gsettings set org.gnome.desktop.background picture-uri "file:///usr/share/backgrounds/ubuntu-default-greyscale-wallpaper.png"
        ExecStart=/usr/bin/gsettings set org.gnome.desktop.interface enable-hot-corners false
        [Install]
        WantedBy=graphical-session.target
      permissions: '0644'
    - path: /etc/profile.d/restic.sh
      content: |
        #!/bin/sh
        REGION=$(cloud-init query region)
        STACK_NAME=ec2-gaming-sunshine
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        export RESTIC_REPOSITORY=s3:https://s3.${REGION}.amazonaws.com/${STACK_NAME}-library-${ACCOUNT_ID}
        export RESTIC_PASSWORD=sunshine
      permissions: '0644'
    - path: /usr/local/bin/backup
      content: |
        #!/bin/sh
        restic snapshots || restic init
        restic backup /mnt/sunshine
      permissions: '0755'
      defer: true
    - path: /usr/local/bin/restore
      content: |
        #!/bin/sh
        restic snapshots && \
          restic restore latest -v --target / --host $(hostname -s)
        read -p "press any key"
      permissions: '0755'
      defer: true
    - path: /usr/local/share/applications/restore.desktop
      content: |
        [Desktop Entry]
        Type=Application
        Name=Restore
        Exec=/usr/local/bin/restore
        Terminal=true
      permissions: '0644'
      defer: true
    - path: /usr/local/share/applications/backup.desktop
      content: |
        [Desktop Entry]
        Type=Application
        Name=Backup
        Exec=/usr/local/bin/backup
        Terminal=true
      permissions: '0644'
      defer: true
    runcmd:
      - systemctl enable init_mnt
      - systemctl enable spot-termination-monitor
      - rm -f /etc/apt/sources.list.d/steam.list
      - /opt/install_amd_driver.sh
      - apt update
      - apt install -y libc6:i386 libegl1:amd64 libegl1:i386 libgbm1:amd64 libgbm1:i386 libgl1-mesa-dri:amd64 libgl1-mesa-dri:i386 libgl1:amd64 libgl1:i386 steam-libs-i386:i386
      - wget https://github.com/LizardByte/Sunshine/releases/download/v0.23.1/sunshine-ubuntu-24.04-amd64.deb
      - apt install -y ./sunshine-ubuntu-24.04-amd64.deb
      - rm -f ./sunshine-ubuntu-24.04-amd64.deb
      - patch /usr/lib/systemd/user/sunshine.service < /opt/sunshine_systemd_user_service.patch
      - loginctl enable-linger sunshine
      - su -c "systemctl --user enable sunshine" sunshine
      - su -c "systemctl --user enable init_desktop_settings" sunshine
      - su -c "desktop-file-install --dir=/home/sunshine/.config/autostart /usr/local/share/applications/restore.desktop" sunshine
      - wget https://github.com/lutris/lutris/releases/download/v0.5.18/lutris_0.5.18_all.deb
      - apt install -y ./lutris_0.5.18_all.deb
      - rm -f ./lutris_0.5.18_all.deb
      - apt install -y wine64 wine32 libasound2-plugins:i386 libsdl2-2.0-0:i386 libdbus-1-3:i386 libsqlite3-0:i386

# vim: ft=yaml.cloudformation
